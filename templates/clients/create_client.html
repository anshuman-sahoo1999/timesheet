{% extends "layout.html" %}

{% block title %}Client Master - PMS Ecometrix{% endblock %}

{% block content %}
<style>
    :root {
        --client-primary: #0e8749;
        --client-primary-hover: #0b733d;
        --client-glow: rgba(14, 135, 73, 0.16);
        --client-border: #cbd5e1;
        --client-bg-card: #ffffff;
        --client-text-slate: #0f172a;
        --client-text-muted: #64748b;
    }

    .client-page-container {
        max-width: 1300px;
        margin: 0 auto;
        padding-bottom: 40px;
    }

    /* Page Header */
    .client-header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 14px;
    }

    .client-heading-title {
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--client-primary);
        letter-spacing: -0.02em;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .btn-view-clients {
        background: #5b9a2b;
        color: #ffffff;
        border: none;
        padding: 9px 24px;
        border-radius: 99px;
        font-size: 0.88rem;
        font-weight: 700;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 12px rgba(91, 154, 43, 0.25);
        transition: all 0.25s ease;
    }

    .btn-view-clients:hover {
        background: #4a8022;
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(91, 154, 43, 0.35);
    }

    /* Client Form Card */
    .client-card {
        background: var(--client-bg-card);
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 32px 36px;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
        position: relative;
    }

    /* 3-Column Form Grid (2 rows x 3 columns) */
    .client-form-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
        margin-bottom: 28px;
    }

    .client-field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .client-field-label {
        font-size: 0.82rem;
        font-weight: 700;
        color: #334155;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .client-field-label .required-star {
        color: #e11d48;
        font-weight: 800;
    }

    .client-input-wrap {
        position: relative;
        display: flex;
        align-items: center;
    }

    .client-field-icon {
        position: absolute;
        left: 14px;
        color: #94a3b8;
        font-size: 0.9rem;
        pointer-events: none;
        transition: color 0.2s ease;
    }

    .client-input {
        width: 100%;
        height: 48px;
        background: #ffffff;
        border: 1px solid var(--client-border);
        border-radius: 10px;
        padding: 0 16px 0 42px;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--client-text-slate);
        outline: none;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .client-input:focus {
        border-color: var(--client-primary);
        box-shadow: 0 0 0 3px var(--client-glow);
    }

    .client-input:focus + .client-field-icon {
        color: var(--client-primary);
    }

    /* Action Buttons */
    .client-action-bar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-top: 10px;
    }

    .btn-submit-client {
        background: #f59e0b;
        color: #ffffff;
        border: none;
        padding: 11px 32px;
        border-radius: 99px;
        font-size: 0.92rem;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
        transition: all 0.25s ease;
    }

    .btn-submit-client:hover {
        background: #d97706;
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
    }

    .btn-cancel-client {
        background: #f8fafc;
        color: #64748b;
        border: 1px solid #cbd5e1;
        padding: 11px 24px;
        border-radius: 99px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s ease;
    }

    .btn-cancel-client:hover {
        background: #f1f5f9;
        color: #334155;
    }

    @media (max-width: 992px) {
        .client-form-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 640px) {
        .client-form-grid {
            grid-template-columns: 1fr;
        }
        .client-card {
            padding: 20px;
        }
    }

    @media (max-width: 576px) {
        .client-header-bar {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
        .client-heading-title {
            font-size: 1.3rem;
        }
        .btn-view-clients {
            padding: 7px 18px;
            font-size: 0.82rem;
        }
        .client-card {
            padding: 16px 12px;
            border-radius: 14px;
        }
        .client-action-bar {
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
        }
        .btn-submit-client,
        .btn-cancel-client {
            width: 100%;
            justify-content: center;
        }
    }
</style>

<div class="client-page-container">
    <!-- Header: Client Master with View Button (Matching Image 1) -->
    <div class="client-header-bar">
        <h1 class="client-heading-title">
            <i class="fas fa-building-user"></i>
            <span>Client Master</span>
        </h1>
        <a href="{{ url_for('manage_clients') }}" class="btn-view-clients">
            <i class="fas fa-table-list"></i>
            <span>View</span>
        </a>
    </div>

    <!-- Client Master Form Card -->
    <div class="client-card">
        <form method="POST" action="{{ url_for('create_client') }}" id="clientMasterForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- 2 Rows x 3 Columns Form Grid (Matching Image 1) -->
            <div class="client-form-grid">
                <!-- 1. Name of Client/Organization * -->
                <div class="client-field-group">
                    <label for="client_name" class="client-field-label">
                        <i class="fas fa-city text-primary"></i>
                        <span>Name of Client / Organization</span>
                        <span class="required-star">*</span>
                    </label>
                    <div class="client-input-wrap">
                        <i class="fas fa-landmark client-field-icon"></i>
                        <input type="text" class="client-input" id="client_name" name="client_name" placeholder="Enter Client / Organization Name" required autofocus>
                    </div>
                </div>

                <!-- 2. Name of Department/Government/Company * -->
                <div class="client-field-group">
                    <label for="department_name" class="client-field-label">
                        <i class="fas fa-building text-primary"></i>
                        <span>Name of Department / Government / Company</span>
                        <span class="required-star">*</span>
                    </label>
                    <div class="client-input-wrap">
                        <i class="fas fa-sitemap client-field-icon"></i>
                        <input type="text" class="client-input" id="department_name" name="department_name" placeholder="Enter Department / Government / Authority" required>
                    </div>
                </div>

                <!-- 3. Mobile -->
                <div class="client-field-group">
                    <label for="mobile" class="client-field-label">
                        <i class="fas fa-phone text-muted"></i>
                        <span>Mobile</span>
                    </label>
                    <div class="client-input-wrap">
                        <i class="fas fa-mobile-screen-button client-field-icon"></i>
                        <input type="tel" class="client-input" id="mobile" name="mobile" placeholder="Contact Mobile Number">
                    </div>
                </div>

                <!-- 4. GST Number -->
                <div class="client-field-group">
                    <label for="gst_number" class="client-field-label">
                        <i class="fas fa-receipt text-muted"></i>
                        <span>GST Number</span>
                    </label>
                    <div class="client-input-wrap">
                        <i class="fas fa-file-invoice client-field-icon"></i>
                        <input type="text" class="client-input" id="gst_number" name="gst_number" placeholder="Enter GSTIN Number" maxlength="20" style="text-transform: uppercase;">
                    </div>
                </div>

                <!-- 5. PAN -->
                <div class="client-field-group">
                    <label for="pan" class="client-field-label">
                        <i class="fas fa-id-card text-muted"></i>
                        <span>PAN</span>
                    </label>
                    <div class="client-input-wrap">
                        <i class="fas fa-credit-card client-field-icon"></i>
                        <input type="text" class="client-input" id="pan" name="pan" placeholder="Enter Permanent Account Number" maxlength="15" style="text-transform: uppercase;">
                    </div>
                </div>

                <!-- 6. Address -->
                <div class="client-field-group">
                    <label for="address" class="client-field-label">
                        <i class="fas fa-location-dot text-muted"></i>
                        <span>Address</span>
                    </label>
                    <div class="client-input-wrap">
                        <i class="fas fa-map-location-dot client-field-icon"></i>
                        <input type="text" class="client-input" id="address" name="address" placeholder="Enter Office / Operational Address">
                    </div>
                </div>
            </div>

            <!-- Submit Button (Matching Image 1 Yellow Pill) -->
            <div class="client-action-bar">
                <button type="submit" class="btn-submit-client">
                    <i class="fas fa-check-circle"></i>
                    <span>Submit</span>
                </button>
                <a href="{{ url_for('manage_clients') }}" class="btn-cancel-client">
                    <i class="fas fa-times"></i>
                    <span>Cancel</span>
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
