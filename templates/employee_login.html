<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login - PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-form {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-form h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-left">
        <img src="{{ url_for('static', filename='emc-logo.png') }}" alt="Ecometrix Logo" style="width: 180px; margin-bottom: 18px;">
        <div class="login-title-bg">
            <div class="login-title">Project Management System</div>
            <div class="login-slogan">Unlocking Transformation</div>
        </div>
    </div>
    <div class="login-card">
        <div class="login-card-accent"></div>
        <div class="login-form-content">
            <h2 class="text-center">Employee Portal Login</h2>
            <form method="POST" action="{{ url_for('employee_login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label for="email" class="form-label">Work Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('landing_page') }}">Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
