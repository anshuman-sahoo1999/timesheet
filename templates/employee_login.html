<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Employee Login - PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
        }
        .login-left {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0e8749;
        }
        .login-slogan {
            color: #475569;
            font-size: 0.95rem;
        }
        .login-card {
            background: #fff;
            padding: 28px 24px;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            margin-bottom: 18px;
            font-size: 1.35rem;
        }
        @media (min-width: 900px) {
            body {
                flex-direction: row;
                gap: 48px;
            }
        }
        @media (max-width: 768px) {
            .form-control { font-size: 16px !important; min-height: 44px; }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-left">
        <img src="{{ url_for('static', filename='emc-logo.png') }}" alt="Ecometrix Logo" style="width: 180px; margin-bottom: 18px;">
        <div class="login-title-bg">
            <div class="login-title">Project Management System</div>
            <div class="login-slogan">Unlocking Transformation</div>
        </div>
    </div>
    <div class="login-card">
        <div class="login-card-accent"></div>
        <div class="login-form-content">
            <h2 class="text-center">Employee Portal Login</h2>
            <form method="POST" action="{{ url_for('employee_login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label for="email" class="form-label">Work Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('landing_page') }}">Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
